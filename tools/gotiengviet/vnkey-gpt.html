<!doctype html>
<html lang="vi" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>VNKeys JS</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
        }

        #vietnameseText {
            min-height: 320px;
            resize: vertical;
        }
    </style>
</head>

<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">

                <div class="card shadow border-secondary">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 mb-2">VNKeys JS</h1>
                        <p class="text-body-secondary mb-4">
                            Chọn kiểu gõ rồi nhập nội dung bên dưới.
                        </p>

                        <fieldset class="mb-4">
                            <legend class="fs-6 mb-3">Kiểu gõ</legend>

                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="vnkeys_method"
                                           id="methodTelex"
                                           value="telex"
                                           checked>
                                    <label class="form-check-label" for="methodTelex">
                                        Telex
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="vnkeys_method"
                                           id="methodVni"
                                           value="vni">
                                    <label class="form-check-label" for="methodVni">
                                        VNI
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="vnkeys_method"
                                           id="methodViqr"
                                           value="viqr">
                                    <label class="form-check-label" for="methodViqr">
                                        VIQR
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="vnkeys_method"
                                           id="methodAuto"
                                           value="auto">
                                    <label class="form-check-label" for="methodAuto">
                                        Auto
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="vnkeys_method"
                                           id="methodOff"
                                           value="off">
                                    <label class="form-check-label" for="methodOff">
                                        Tắt
                                    </label>
                                </div>
                            </div>
                        </fieldset>

                        <div class="mb-3">
                            <label for="vietnameseText" class="form-label">
                                Nội dung
                            </label>

                            <!-- data-vnkeys enables VNKeys on this textarea -->
                            <textarea id="vietnameseText"
                                      class="form-control form-control-lg"
                                      data-vnkeys
                                      autofocus
                                      spellcheck="false"
                                      placeholder="Ví dụ Telex: Tooi yeeu tieengs Vieetj."></textarea>
                        </div>

                        <div class="alert alert-secondary mb-0 small">
                            <strong>Telex:</strong> <code>tieengs vieetj</code> → tiếng Việt
                            <br>
                            <strong>VNI:</strong> <code>tie61ng Vie65t</code> → tiếng Việt
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- VNKeys JS: for production, prefer downloading and hosting this file locally. -->
    <script src="https://vnkeys.net/raw.htm?skey=vnkeys_js"></script>

    <script>
        const methodInputs = document.querySelectorAll(
            'input[name="vnkeys_method"]'
        );

        methodInputs.forEach((input) => {
            input.addEventListener("change", () => {
                VNKeys.setMethod();
            });
        });

        // Apply the default selected method: Telex.
        VNKeys.setMethod("telex");
    </script>
</body>
</html>
